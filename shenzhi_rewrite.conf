# 神指拨号 (com.bolaa.SZSmartDial v3.7.7) 广告拦截 - 重写规则
# 配合 MITM 使用, 拦截 HTTPS 广告请求并返回空数据

[rewrite_local]
# === 穿山甲/CSJ ===
^https?:\/\/.*\.snssdk\.com\/.*\/(ad|splash|feed|interstitial) url reject
^https?:\/\/.*\.isnssdk\.com\/.*\/(ad|splash|feed) url reject
^https?:\/\/.*\.pstatp\.com\/img\/ad url reject
^https?:\/\/.*\.toutiao\.com\/.*\/(ad|advert|splash) url reject
^https?:\/\/.*\.oceanengine\.com\/.*\/(ad|splash) url reject

# === 优量汇/GDT ===
^https?:\/\/.*\.qq\.com\/.*\/(gdt|ad|advert|splash) url reject
^https?:\/\/.*\.ugdtimg\.com\/.*\/ad url reject

# === 快手/KSAd ===
^https?:\/\/.*\.(gifshow|kuaishou)\.com\/.*\/(ad|advert|splash|feed) url reject
^https?:\/\/.*\.ksapisrv\.com\/.*\/ulog url reject
^https?:\/\/.*\.(kskwai|gskwai)\.com\/.*\/ad url reject

# === 可疑追踪 ===
^https?:\/\/.*\.puata\.info\/ url reject
^https?:\/\/.*\.eastday\.com\/ url reject

[mitm]
hostname = %APPEND% *.snssdk.com,*.isnssdk.com,*.sgsnssdk.com,*.pstatp.com,*.byteimg.com,*.toutiao.com,*.oceanengine.com,*.pangle.io,*.kaijia.com,*.umeng.com,*.qq.com,*.ugdtimg.com,*.gifshow.com,*.kuaishou.com,*.kskwai.com,*.gskwai.com,*.ksapisrv.com,*.puata.info,*.eastday.com,*.kuaishouzt.com,*.kwaizt.com
